<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ad.css">
<style>
.bg { background-image: url(img/battle.jpg); filter: saturate(1.1) contrast(1.06); }
.top { background: linear-gradient(180deg, rgba(3,18,30,.93) 0%, rgba(3,18,30,.75) 15%, rgba(3,18,30,.35) 24%, rgba(3,18,30,0) 30%); }
.bot { background: linear-gradient(0deg, rgba(2,12,22,.97) 0%, rgba(2,14,26,.9) 19%, rgba(3,20,34,.55) 25%, rgba(3,20,34,0) 33%); }
.flash { background: radial-gradient(30% 10% at 50% 44%, rgba(255,226,150,.25), transparent 70%); mix-blend-mode: screen; }
.hd { top: 54px; }
.title { top: 210px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.h1 { font-size: 120px; }
.kicker { color: #ffd36e; }
.ammo { bottom: 316px; }
.ammo .lbl { text-align: center; font: 800 24px var(--sans); letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold-hi); text-shadow: 0 2px 10px rgba(0,0,0,.8); margin-bottom: 18px; }
.dots { display: flex; justify-content: center; gap: 14px; }
.shot { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 170px; font: 700 22px var(--sans); color: #fff; text-align: center; }
.shot b { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: rgba(6,26,38,.6); border: 1.5px solid rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 26px rgba(0,8,16,.4); }
.shot b i { width: 40px; height: 40px; border-radius: 50%; display: block; }
.foot { bottom: 84px; }
</style></head><body><div class="ad">
<div class="bg"></div><div class="shade flash"></div><div class="shade top"></div><div class="shade bot"></div>
<div class="layer hd brand"><div data-part="logo" data-cls="sm"></div></div>
<div class="layer title">
  <div class="kicker">Real-time broadsides</div>
  <div class="h1">Fire<br><span class="g">at will!</span></div>
</div>
<div class="layer ammo">
  <div class="lbl">Load your guns with</div>
  <div class="dots">
    <div class="shot"><b><i style="background:radial-gradient(circle at 35% 30%,#9aa4ab,#2b3237 70%)"></i></b>Round shot</div>
    <div class="shot"><b><i style="background:radial-gradient(circle at 35% 30%,#ffe9a6,#e0582a 60%,#5a1608)"></i></b>Fire shot</div>
    <div class="shot"><b><i style="background:radial-gradient(circle at 35% 30%,#fff,#ffb347 40%,#8a2b06 80%)"></i></b>Explosive shell</div>
    <div class="shot"><b><i style="background:linear-gradient(90deg,transparent 40%,#aeb6bb 40%,#aeb6bb 60%,transparent 60%),radial-gradient(circle at 20% 50%,#59636a 28%,transparent 30%),radial-gradient(circle at 80% 50%,#59636a 28%,transparent 30%)"></i></b>Chain shot</div>
    <div class="shot"><b><i style="background:radial-gradient(circle at 30% 30%,#b8c0c5 18%,transparent 20%),radial-gradient(circle at 70% 30%,#b8c0c5 18%,transparent 20%),radial-gradient(circle at 30% 70%,#b8c0c5 18%,transparent 20%),radial-gradient(circle at 70% 70%,#b8c0c5 18%,transparent 20%),radial-gradient(circle at 50% 50%,#b8c0c5 18%,transparent 20%)"></i></b>Grape shot</div>
  </div>
</div>
<div class="layer foot" data-part="cta" data-label="Join the battle"></div>
</div><script src="parts.js"></script><script src="icons.js"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ad.css">
<style>
html, body, .ad { background: transparent !important; }
.o { position: absolute; left: 0; right: 0; text-align: center; will-change: transform, opacity; }
.big { font-family: var(--serif); font-weight: 800; text-transform: uppercase; line-height: 0.95; font-size: 146px; color: #fff; text-shadow: 0 8px 36px rgba(0,10,20,.65), 0 2px 6px rgba(0,0,0,.45); }
.big.gold { background: linear-gradient(180deg, #fff6dc 0%, #ffd67a 45%, #e8a640 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 8px 26px rgba(0,10,20,.7)); }
.line { display: block; }
.kicker { margin-bottom: 22px; }
#veilT { position: absolute; left: 0; right: 0; top: 0; height: 640px; background: linear-gradient(180deg, rgba(2,14,24,.72), rgba(2,14,24,.35) 55%, rgba(2,14,24,0)); }
#veilB { position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: linear-gradient(0deg, rgba(2,12,22,.82), rgba(2,12,22,0)); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#endbg { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 40%, rgba(3,16,40,.5), rgba(2,8,22,.9)); opacity: 0; }
#wm { top: 64px; }
#cta { bottom: 300px; }
#end { top: 560px; }
.logo.xl { font-size: 150px; }
.crest { width: 130px; height: 130px; }
</style></head><body><div class="ad">
<div id="veilT"></div><div id="veilB"></div><div id="endbg"></div>
<div class="o" id="wm"><div class="brand" data-part="logo" data-cls="sm" style="transform:scale(.8)"></div></div>
<div id="titles"></div>
<div class="o" id="end"><div class="brand"><div data-part="crest"></div><div data-part="logo" data-cls="xl"></div></div><div class="sub" id="endsub" style="margin-top:34px">Sail, fight and explore with friends</div></div>
<div class="o" id="cta" data-part="cta"></div>
<div id="flash"></div>
</div><script src="parts.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const cl = (x) => Math.max(0, Math.min(1, x));
const eo = (x) => 1 - Math.pow(1 - cl(x), 3);
const back = (x) => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
if (location.search.includes('short')) window.CFG = {
  cuts: [3.0, 7.5],
  titles: [
    [null, 'Your ship.', 'Your sea.', 1400, 0.15, 2.75],
    ['Real-time naval combat', 'Broadside', 'battles', 1380, 3.15, 7.25],
    ['Fireworks · Co-op with friends', 'Light up', 'the night', 236, 7.65, 10.6, '#ff9ee0'],
  ],
  volleys: [4.1, 6.33], foe: [4.25, 6.48],
  wmOut: 10.6, end: 10.9, cta: 12.0, dur: 14.5,
};
// each title: [kicker, white line, gold line, top px, in, out, kicker colour]
const CFG = window.CFG || {
  cuts: [4.0, 7.5, 12.0, 15.5],
  titles: [
    [null, 'Your ship.', 'Your sea.', 1400, 0.15, 3.75],
    ['Discover Las Brumas', 'Beyond', 'the mist', 236, 4.15, 7.25, '#9fe8c8'],
    ['Real-time naval combat', 'Broadside', 'battles', 1380, 7.65, 11.75],
    ['Storms · Krakens · Maelstroms', 'Beware', 'the deep', 1380, 12.15, 15.25, '#ffd36e'],
    ['Fireworks · Co-op with friends', 'Light up', 'the night', 236, 15.65, 18.6, '#ff9ee0'],
  ],
  volleys: [8.6, 10.83], foe: [8.75, 10.98],
  wmOut: 18.6, end: 18.9, cta: 20.0, dur: 22.5,
};
const box = $('titles');
const T = CFG.titles.map(([k, a, b, top, tin, tout, kc], i) => {
  const d = document.createElement('div'); d.className = 'o'; d.style.top = top + 'px';
  d.innerHTML = (k ? `<div class="kicker"${kc ? ` style="color:${kc}"` : ''}>${k}</div>` : '') + `<span class="big line">${a}</span><span class="big gold line">${b}</span>`;
  box.appendChild(d);
  const [ke, ae, be] = k ? d.children : [null, ...d.children];
  return { ke, ae, be, tin, tout };
});
// a word that punches in (scale + rise + blur) at `at` and leaves at `out`
function pop(el, t, at, out, dy = 70) {
  const a = (t - at) / 0.38, b = (t - out) / 0.25;
  const vis = cl(a * 2.2) * (1 - cl(b));
  const s = 0.84 + 0.16 * back(a);
  const y = (1 - eo(a)) * dy - eo(b) * 40;
  el.style.opacity = vis;
  el.style.transform = `translateY(${y}px) scale(${s})`;
  el.style.filter = el.classList.contains('gold') ? `drop-shadow(0 8px 26px rgba(0,10,20,.7)) blur(${(1 - cl(a * 1.6)) * 14}px)` : `blur(${(1 - cl(a * 1.6)) * 14}px)`;
}
window.render = (t) => {
  for (const x of T) {
    if (x.ke) pop(x.ke, t, x.tin - 0.12, x.tout, 30);
    pop(x.ae, t, x.tin, x.tout);
    pop(x.be, t, x.tin + 0.5, x.tout);
  }
  const wm = cl((t - 0.4) / 0.5) * (1 - cl((t - CFG.wmOut) / 0.3));
  $('wm').style.opacity = wm * 0.92;
  $('veilT').style.opacity = 0.9;
  $('veilB').style.opacity = 1 - cl((t - CFG.end) / 0.5) * 0.3;
  const e = (t - CFG.end) / 0.9;
  $('endbg').style.opacity = eo(e);
  const en = $('end');
  en.style.opacity = cl(e * 1.5);
  en.style.transform = `translateY(${(1 - eo(e)) * 60}px) scale(${0.9 + 0.1 * eo(e)})`;
  en.style.filter = `blur(${(1 - cl(e * 1.4)) * 16}px)`;
  const c = (t - CFG.cta) / 0.45;
  const cta = $('cta');
  cta.style.opacity = cl(c * 2);
  const pulse = t > CFG.cta + 0.7 ? 1 + 0.035 * Math.sin((t - CFG.cta - 0.7) * Math.PI * 2 / 1.1) : 1;
  cta.style.transform = `translateY(${(1 - eo(c)) * 80}px) scale(${(0.8 + 0.2 * back(c)) * pulse})`;
  let f = 0;
  for (const v of CFG.volleys) f = Math.max(f, 0.22 * Math.exp(-Math.max(0, t - v) * 9) * (t >= v ? 1 : 0));
  for (const v of CFG.foe) f = Math.max(f, 0.12 * Math.exp(-Math.max(0, t - v) * 9) * (t >= v ? 1 : 0));
  for (const cut of CFG.cuts) { const d = t - cut; if (d >= 0 && d < 0.3) f = Math.max(f, 0.55 * (1 - d / 0.3)); }
  $('flash').style.opacity = f;
};
render(0);
</script></body></html>

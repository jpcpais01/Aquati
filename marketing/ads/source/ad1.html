<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ad.css">
<style>
.bg { background-image: url(img/paradise.jpg); background-size: 1170px auto; background-position: 50% -150px; filter: saturate(1.08) contrast(1.04); }
.top { background: linear-gradient(180deg, rgba(3,22,36,.82) 0%, rgba(3,22,36,.55) 11%, rgba(3,22,36,.15) 19%, rgba(3,22,36,0) 25%); }
.bot { background: linear-gradient(0deg, rgba(2,14,24,.96) 0%, rgba(2,16,28,.84) 22%, rgba(3,24,40,.4) 33%, rgba(3,24,40,0) 40%); }
.glow { background: radial-gradient(60% 26% at 50% 5%, rgba(255,226,160,.2), transparent 70%); }
.hd { top: 66px; }
.copy { bottom: 400px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.feat { bottom: 300px; }
.foot { bottom: 80px; }
</style></head><body><div class="ad">
<div class="bg"></div><div class="shade top"></div><div class="shade glow"></div><div class="shade bot"></div><div class="shade vig"></div>
<div class="layer hd brand"><div data-part="crest"></div><div data-part="logo"></div></div>
<div class="layer copy">
  <div class="kicker">Open-world pirate adventure</div>
  <div class="h1" style="font-size:116px">Sail into<br><span class="g">paradise</span></div>
</div>
<div class="layer feat chips sm">
  <span class="chip" data-icon="palm">Two archipelagos to explore</span>
  <span class="chip" data-icon="cannon">Real-time sea battles</span>
  <span class="chip" data-icon="chest">Buried treasure</span>
</div>
<div class="layer foot" data-part="cta"></div>
</div><script src="parts.js"></script><script src="icons.js"></script></body></html>

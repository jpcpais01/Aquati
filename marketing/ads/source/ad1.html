<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ad.css">
<style>
.bg { background-image: url(img/HERO_A.jpg); filter: saturate(1.1) contrast(1.04); }
.top { background: linear-gradient(180deg, rgba(3,22,36,.86) 0%, rgba(3,22,36,.6) 14%, rgba(3,22,36,.2) 24%, rgba(3,22,36,0) 32%); }
.bot { background: linear-gradient(0deg, rgba(2,14,24,.95) 0%, rgba(2,16,28,.82) 20%, rgba(3,24,40,.35) 30%, rgba(3,24,40,0) 37%); }
.glow { background: radial-gradient(60% 30% at 50% 6%, rgba(255,226,160,.22), transparent 70%); }
.hd { top: 78px; }
.copy { bottom: 430px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.h1 { font-size: 100px; }
.feat { bottom: 316px; }
.foot { bottom: 84px; }
</style></head><body><div class="ad">
<div class="bg"></div><div class="shade top"></div><div class="shade glow"></div><div class="shade bot"></div>
<div class="layer hd brand"><div data-part="crest"></div><div data-part="logo"></div></div>
<div class="layer copy">
  <div class="kicker">Open-sea pirate adventure</div>
  <div class="h1">Sail into<br><span class="g">paradise</span></div>
</div>
<div class="layer feat chips sm">
  <span class="chip" data-icon="palm">12 islands to explore</span>
  <span class="chip" data-icon="cannon">Real-time sea battles</span>
  <span class="chip" data-icon="chest">Buried treasure</span>
</div>
<div class="layer foot" data-part="cta"></div>
</div><script src="parts.js"></script><script src="icons.js"></script></body></html>

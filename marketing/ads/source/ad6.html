<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ad.css">
<style>
.bg { background-image: url(img/kraken.jpg); background-size: 1110px auto; background-position: 0% -30px; filter: saturate(1.1) contrast(1.12) brightness(1.02); }
.top { background: linear-gradient(180deg, rgba(2,10,18,.88) 0%, rgba(2,10,18,.6) 14%, rgba(2,10,18,.15) 26%, rgba(2,10,18,0) 32%); }
.bot { background: linear-gradient(0deg, rgba(1,8,14,.97) 0%, rgba(1,10,18,.86) 14%, rgba(2,14,24,.3) 22%, rgba(2,14,24,0) 28%); }
.bolt { background: radial-gradient(50% 18% at 30% 8%, rgba(190,220,255,.18), transparent 70%); mix-blend-mode: screen; }
.hd { top: 52px; }
.title { top: 214px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.h1 { font-size: 112px; }
.kicker { color: #ffd36e; }
.feat { bottom: 296px; }
.foot { bottom: 80px; }
</style></head><body><div class="ad">
<div class="bg"></div><div class="shade bolt"></div><div class="shade top"></div><div class="shade bot"></div><div class="shade vig"></div>
<div class="layer hd brand"><div data-part="logo" data-cls="sm"></div></div>
<div class="layer title">
  <div class="kicker">Storms · Krakens · Maelstroms</div>
  <div class="h1">The deep<br><span class="g">is waking</span></div>
</div>
<div class="layer feat chips sm">
  <span class="chip" data-icon="storm">Raging storms</span>
  <span class="chip" data-icon="tentacle">The Kraken</span>
  <span class="chip" data-icon="swirl">Whirlpools</span>
</div>
<div class="layer foot" data-part="cta" data-label="Face the deep"></div>
</div><script src="parts.js"></script><script src="icons.js"></script></body></html>

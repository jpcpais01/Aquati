<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ad.css">
<style>
.bg { background-image: url(img/night.jpg); background-size: 1140px auto; background-position: 50% -95px; filter: saturate(1.12) contrast(1.05); }
.top { background: linear-gradient(180deg, rgba(2,8,26,.85) 0%, rgba(2,8,26,.55) 12%, rgba(2,8,26,0) 24%); }
.bot { background: linear-gradient(0deg, rgba(2,8,22,.97) 0%, rgba(2,10,26,.86) 14%, rgba(3,14,34,.3) 22%, rgba(3,14,34,0) 27%); }
.hd { top: 52px; }
.title { top: 214px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.h1 { font-size: 112px; }
.kicker { color: #ff9ee0; }
.tdim { background: radial-gradient(62% 13% at 50% 12%, rgba(2,8,26,.82), rgba(2,8,26,.4) 60%, rgba(2,8,26,0) 100%); }
.h1 .g { filter: drop-shadow(0 4px 14px rgba(2,6,20,.95)) drop-shadow(0 0 30px rgba(2,6,20,.8)); }
.feat { bottom: 296px; }
.foot { bottom: 80px; }
</style></head><body><div class="ad">
<div class="bg"></div><div class="shade top"></div><div class="shade bot"></div><div class="shade vig"></div><div class="shade tdim"></div>
<div class="layer hd brand"><div data-part="logo" data-cls="sm"></div></div>
<div class="layer title">
  <div class="kicker">Fireworks · Moonlit seas · Co-op</div>
  <div class="h1">Light up<br><span class="g">the night</span></div>
</div>
<div class="layer feat chips sm">
  <span class="chip" data-icon="firework">13 kinds of fireworks</span>
  <span class="chip" data-icon="crew">Sail with friends</span>
  <span class="chip" data-icon="moon">Real night skies</span>
</div>
<div class="layer foot" data-part="cta"></div>
</div><script src="parts.js"></script><script src="icons.js"></script></body></html>

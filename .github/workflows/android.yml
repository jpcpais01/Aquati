# Builds the native Android game (godot/) into a signed APK.
#
# Every push to main that touches the Godot project publishes the APK as a
# GitHub release. Pull requests and other pushes build and smoke-test it the
# same way and keep the APK as a workflow artifact.
#
# Signing: add the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (see godot/README.md). Until
# they exist, the APK is signed with the shared fallback key in
# .github/android/fallback-debug.keystore, so releases keep working.

name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/android.yml'
      - '.github/android/**'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/android.yml'
      - '.github/android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: 'stable'

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-android-v1

      - name: Download Godot and its Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot-dl && cd ~/godot-dl
          curl -fsSL --retry 4 -o editor.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q editor.zip && rm editor.zip
          mv "Godot_v${V}_linux.x86_64" godot
          chmod +x godot
          curl -fsSL --retry 4 -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          mkdir -p tpl
          unzip -q -j templates.tpz 'templates/android_*' 'templates/version.txt' -d tpl
          rm templates.tpz
          ls -la tpl

      - name: Install Godot
        run: |
          set -euo pipefail
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL"
          cp ~/godot-dl/tpl/* "$TPL/"
          sudo ln -sf ~/godot-dl/godot /usr/local/bin/godot
          godot --version

      - name: Version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < godot/VERSION)
          NAME="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" godot/export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${NAME}\"|" godot/export_presets.cfg
          sed -i "s|^config/version=.*|config/version=\"${NAME}\"|" godot/project.godot
          grep -n "^version/" godot/export_presets.cfg

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          FALLBACK="$GITHUB_WORKSPACE/.github/android/fallback-debug.keystore"
          if [ -n "${KEYSTORE_B64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${KEY_ALIAS}"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "SIGNED_WITH=release"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No release signing secrets yet, so the APK is signed with the shared fallback key."
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=${FALLBACK}"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
              echo "SIGNED_WITH=fallback"
            } >> "$GITHUB_ENV"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${FALLBACK}"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Import the project
        working-directory: godot
        run: |
          set -uo pipefail
          # the first pass fills the import cache (on a fresh checkout the theme
          # is read before its font is imported, a harmless one-off error);
          # the second has everything in place and must come out clean
          godot --headless --import > "$RUNNER_TEMP/import-first.log" 2>&1 || true
          godot --headless --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E "Parse Error|SCRIPT ERROR|Failed to load script|Compile Error" "$RUNNER_TEMP/import.log"; then
            echo "::error::GDScript errors while importing"
            exit 1
          fi

      - name: Check every script
        working-directory: godot
        run: |
          set -uo pipefail
          rc=0
          timeout 600 godot --headless --script res://tools/check.gd 2>&1 | tee "$RUNNER_TEMP/check.log" || rc=$?
          if [ "$rc" = 124 ]; then
            echo "::error::The script check hung (a loop that never ends?)"
            exit 1
          fi
          if ! grep -q "CHECK OK" "$RUNNER_TEMP/check.log"; then
            echo "::error::Script check failed"
            exit 1
          fi

      - name: Bake the world
        working-directory: godot
        run: |
          set -uo pipefail
          godot --headless --script res://tools/bake.gd 2>&1 | tee "$RUNNER_TEMP/bake.log"
          if ! grep -q "BAKE OK" "$RUNNER_TEMP/bake.log"; then
            echo "::error::World bake failed"
            exit 1
          fi

      - name: Smoke test (the harbour's menus, then a voyage, headless)
        working-directory: godot
        run: |
          set -uo pipefail
          # a fixed 60 frames a second of game time, however fast the runner
          # draws them: the tour of the menus takes its steps on frames (and
          # waits up to 600 of them twice for a hull off the slipway, which
          # on a fast runner takes more frames, so it has room for both)
          timeout 400 godot --headless --fixed-fps 60 --quit-after 2500 -- --smoke --smoke-at 2300 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid get|Invalid set|Nonexistent function|SMOKE FAILED" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::Errors while running the game"
            exit 1
          fi
          grep -q "SMOKE MENU" "$RUNNER_TEMP/smoke.log" || { echo "::error::The tour of the menus never ran"; exit 1; }
          grep -q "SMOKE OK" "$RUNNER_TEMP/smoke.log" || { echo "::error::The game never reached the voyage"; exit 1; }

      - name: Export the APK
        working-directory: godot
        run: |
          set -uo pipefail
          mkdir -p ../build
          godot --headless --export-release "Android" ../build/shores-o-fortune.apk 2>&1 | tee "$RUNNER_TEMP/export.log"
          test -s ../build/shores-o-fortune.apk || { echo "::error::No APK came out of the export"; exit 1; }
          ls -la ../build

      - name: Verify the signature
        run: |
          set -euo pipefail
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --verbose --print-certs build/shores-o-fortune.apk | grep -E "Verified|Signer #1 certificate (DN|SHA-256)"

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: shores-o-fortune-${{ steps.ver.outputs.name }}
          path: build/shores-o-fortune.apk
          retention-days: 14

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="${{ steps.ver.outputs.name }}"
          TAG="android-v${NAME}"
          APK="build/shores-o-fortune-${NAME}.apk"
          cp build/shores-o-fortune.apk "$APK"
          {
            cat godot/RELEASE_NOTES.md
            echo
            echo "---"
            echo
            echo "Install: download \`shores-o-fortune-${NAME}.apk\` on your phone and open it (allow installs from your browser if Android asks). Needs Android 7 or newer, 64-bit."
            if [ "${SIGNED_WITH}" = "fallback" ]; then
              echo
              echo "_Signed with the shared test key until the release key is added to the repository secrets._"
            fi
            echo
            echo "Built from ${GITHUB_SHA::7}."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$APK" \
            --title "Shores O' Fortune for Android ${NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            --latest
